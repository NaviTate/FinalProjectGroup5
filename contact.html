<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beanfolk | Contact</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light text-dark">
    <nav class="navbar navbar-expand-lg bg-light border-bottom border-2 border-light-subtle py-3">
        <div class="container">
            <a class="navbar-brand fw-bold text-dark" href="#">☕ Beanfolk</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                <ul class="navbar-nav align-items-center gap-3">
                    <li class="nav-item"><a class="nav-link text-dark" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link text-dark" href="about.html">About</a></li>
                    <li class="nav-item"><a class="nav-link text-dark" href="guide.html">Guide</a></li>
                    <li class="nav-item"><a class="nav-link text-dark fw-bold" href="contact.html">Contact</a></li>
                    <li class="nav-item">
                        <span class="bg-dark text-white rounded px-2 py-1 d-inline-block">Q</span>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container my-5">
        <div class="row g-5 align-items-start">
            <section class="col-lg-6">
                <h1 class="display-5 fw-normal mb-3">Get in Touch</h1>
                <p class="mb-4">Have questions about a brew? Want to recommend a bean? Fill out the form below and our baristas will get back to you.</p>

                <h2 class="h4 mb-3">Contact us</h2>

                <form>
                    <div class="mb-3">
                        <input type="text" class="form-control rounded-0" placeholder="Name" required>
                    </div>
                    <div class="mb-3">
                        <input type="email" class="form-control rounded-0" placeholder="Email" required>
                    </div>
                    <div class="mb-3">
                        <select class="form-select rounded-0" required>
                            <option value="" disabled selected>Category (e.g. Brewing, Beans, Other)</option>
                            <option value="beans">Coffee Beans</option>
                            <option value="brewing">Brewing Methods</option>
                            <option value="equipment">Equipment</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <textarea class="form-control rounded-0" rows="6" placeholder="Message" required></textarea>
                    </div>
                    <button type="submit" class="btn btn-dark w-100 py-2 rounded-0">Send</button>
                </form>
            </section>

            <aside class="col-lg-6">
                <img src="https://placehold.co/600x300/ECE4D9/3E2723?text=Top+Image" class="img-fluid w-100 mb-3" alt="Coffee setup">

                <div class="row g-3">
                    <div class="col-6">
                        <img src="https://placehold.co/300x300/ECE4D9/3E2723?text=Image+1" class="img-fluid w-100 mb-3" alt="Coffee art">
                        <img src="https://placehold.co/300x300/ECE4D9/3E2723?text=Image+3" class="img-fluid w-100" alt="Coffee cup">
                    </div>
                    <div class="col-6 mt-4">
                        <img src="https://placehold.co/300x400/ECE4D9/3E2723?text=Image+2" class="img-fluid w-100" alt="Barista">
                    </div>
                </div>
            </aside>
        </div>
    </main>

    <footer class="border-top border-2 py-4 mt-5 bg-light">
        <div class="container d-flex justify-content-between align-items-center flex-wrap gap-3">
            <div class="fs-4">☕</div>
            <div class="d-flex flex-wrap gap-3 small">
                <a href="#" class="text-dark text-decoration-none">Socials 1</a>
                <a href="#" class="text-dark text-decoration-none">Socials 2</a>
                <a href="#" class="text-dark text-decoration-none">Socials 3</a>
                <a href="#" class="text-dark text-decoration-none">Socials 4</a>
            </div>
            <button class="btn btn-dark rounded-0 px-4">Sign up</button>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
