<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beanfolk | Contact</title>
    <link rel="icon" type="image/png" href="assets/Icon.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=20261006-contact-bootstrap">
</head>
<body>
    <header>
        <div class="logo"><img src="assets/Icon.png" alt="Beanfolk coffee logo"></div>

        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="guide.html">Guide</a></li>
                <li><a href="contact.html" class="active-link">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main class="contact-page container-fluid">
        <div class="row g-5 contact-layout">
            <section class="col-lg-6 contact-form-panel">
                <h1>Get in Touch</h1>
                <p>Have a question about coffee culture, brewing methods, or Beanfolk? We'd love to hear from you.</p>

                <h2>Send us a message</h2>

                <form class="contact-form">
                    <div class="mb-3">
                        <label class="form-label" for="contact-name">Your name</label>
                        <input id="contact-name" type="text" class="form-control" placeholder="Your name" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label" for="contact-email">Your email</label>
                        <input id="contact-email" type="email" class="form-control" placeholder="Your email" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label" for="contact-topic">Topic</label>
                        <select id="contact-topic" class="form-select" required>
                            <option value="" disabled selected>Choose a topic</option>
                            <option value="coffee-culture">Coffee Culture</option>
                            <option value="brewing">Brewing Methods</option>
                            <option value="coffee-guide">Coffee Guide</option>
                            <option value="feedback">Website Feedback</option>
                            <option value="other">Other</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label" for="contact-message">Message</label>
                        <textarea id="contact-message" class="form-control" rows="7" placeholder="Write your message here..." required></textarea>
                    </div>

                    <div class="form-check mb-3">
                        <input id="contact-newsletter" class="form-check-input" type="checkbox">
                        <label class="form-check-label" for="contact-newsletter">Sign me up for the Beanfolk newsletter</label>
                    </div>

                    <button type="submit" class="btn btn-primary">Send Message</button>
                </form>
            </section>

            <aside class="col-lg-6 contact-gallery">
                <img
                    class="gallery-main"
                    src="https://images.unsplash.com/photo-1501339847302-ac426a4a7cbb?auto=format&fit=crop&w=1200&q=80"
                    alt="Coffee shop interior"
                >

                <div class="gallery-grid">
                    <div class="gallery-column">
                        <img
                            src="https://images.unsplash.com/photo-1495474472287-4d71bcdd2085?auto=format&fit=crop&w=800&q=80"
                            alt="Coffee and latte"
                        >
                        <img
                            src="https://images.unsplash.com/photo-1512568400610-62da28bc8a13?auto=format&fit=crop&w=800&q=80"
                            alt="Latte surrounded by coffee beans"
                        >
                    </div>

                    <div class="gallery-column tall">
                        <img
                            src="https://images.unsplash.com/photo-1445116572660-236099ec97a0?auto=format&fit=crop&w=800&q=80"
                            alt="Barista preparing coffee"
                        >
                    </div>
                </div>
            </aside>
        </div>
    </main>

    <footer>
        <div class="footer-logo">☕ Beanfolk</div>

        <div class="footer-socials">
            <span>Instagram</span>
            <span>Facebook</span>
            <span>X</span>
        </div>

        <button class="btn">Sign up</button>
    </footer>
</body>
</html>
